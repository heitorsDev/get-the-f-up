name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The plugin has no runtime dependencies; this only resolves the local
      # package so `npm test` can run.
      - name: Install
        run: npm install --no-audit --no-fund

      # `omarchy plugin validate .` ships with Omarchy and is not available in
      # CI, so tests/manifest.test.js asserts the same manifest contract
      # (schemaVersion, id, kinds, entry points) instead. It also runs as part
      # of the full suite below.
      - name: Manifest shape
        run: node --test tests/manifest.test.js

      - name: Test
        run: npm test
